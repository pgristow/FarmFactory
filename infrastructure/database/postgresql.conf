# PostgreSQL Configuration for FarmFactory Time-Series Workload
# Optimized for 4GB RAM server with SSD storage
# Sprint 3 - DO-203: TimescaleDB Performance Tuning

# =============================================================================
# MEMORY CONFIGURATION
# =============================================================================

# Shared buffers: 25% of total RAM (4GB server = 1GB)
# Used for caching frequently accessed data
shared_buffers = 1GB

# Effective cache size: 75% of total RAM
# Tells PostgreSQL how much memory is available for caching (OS + PG)
effective_cache_size = 3GB

# Work memory: Memory for sorting and hash operations
# Used per operation, so be conservative with concurrent queries
work_mem = 32MB

# Maintenance work memory: For VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 256MB

# =============================================================================
# TIMESCALEDB CONFIGURATION
# =============================================================================

# TimescaleDB background workers for chunk operations
timescaledb.max_background_workers = 8

# Maximum worker processes (must be >= max_parallel_workers + max_background_workers)
max_worker_processes = 16

# Parallel query execution
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# =============================================================================
# WRITE PERFORMANCE (WAL)
# =============================================================================

# Write-Ahead Log buffers
wal_buffers = 16MB

# Checkpoint completion target (0.9 = spread checkpoints over 90% of interval)
checkpoint_completion_target = 0.9

# Maximum time between automatic checkpoints
checkpoint_timeout = 15min

# Maximum WAL size before forcing checkpoint
max_wal_size = 2GB
min_wal_size = 1GB

# =============================================================================
# QUERY PERFORMANCE
# =============================================================================

# Random page cost for SSD storage (lower than default 4.0 for HDDs)
random_page_cost = 1.1

# Sequential page cost
seq_page_cost = 1.0

# Effective I/O concurrency for SSD storage
effective_io_concurrency = 200

# Default statistics target (higher = better query plans, slower ANALYZE)
default_statistics_target = 100

# =============================================================================
# CONNECTION POOLING
# =============================================================================

# Maximum connections (reserve some for superuser)
max_connections = 100

# Superuser reserved connections
superuser_reserved_connections = 3

# =============================================================================
# QUERY PLANNER
# =============================================================================

# Enable JIT compilation for queries (PostgreSQL 11+)
jit = on

# Enable parallel query execution
max_parallel_workers_per_gather = 4

# =============================================================================
# LOGGING (Performance Monitoring)
# =============================================================================

# Log queries taking longer than 1 second
log_min_duration_statement = 1000

# Detailed log line prefix for debugging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Log checkpoint statistics
log_checkpoints = on

# Log connection information
log_connections = on
log_disconnections = on

# Log lock waits longer than deadlock_timeout
log_lock_waits = on

# Deadlock timeout
deadlock_timeout = 1s

# =============================================================================
# AUTOVACUUM (Critical for time-series data)
# =============================================================================

# Enable autovacuum
autovacuum = on

# Maximum workers for autovacuum
autovacuum_max_workers = 3

# Time between autovacuum runs
autovacuum_naptime = 60s

# Vacuum after 5% of table changes (more aggressive for time-series)
autovacuum_vacuum_scale_factor = 0.05

# Analyze after 2% of table changes (more aggressive for time-series)
autovacuum_analyze_scale_factor = 0.02

# Vacuum cost delay (lower = more aggressive)
autovacuum_vacuum_cost_delay = 10ms

# =============================================================================
# TIME-SERIES SPECIFIC OPTIMIZATIONS
# =============================================================================

# Shared preload libraries (TimescaleDB must be loaded)
shared_preload_libraries = 'timescaledb,pg_stat_statements'

# Track query statistics
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# =============================================================================
# REPLICATION (if needed in future)
# =============================================================================

# WAL level for replication
wal_level = replica

# Maximum number of concurrent WAL senders
max_wal_senders = 3

# Keep WAL segments
wal_keep_size = 1GB

# =============================================================================
# LOCALE AND FORMATTING
# =============================================================================

# Timezone
timezone = 'UTC'

# Date style
datestyle = 'iso, mdy'

# Locale
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Character set
default_text_search_config = 'pg_catalog.english'

# =============================================================================
# PERFORMANCE NOTES
# =============================================================================
#
# This configuration is optimized for:
# - Time-series data workload (high volume inserts, range queries)
# - 4GB RAM server with SSD storage
# - Mixed read/write operations
# - Batch data imports (CSV uploads)
# - Real-time monitoring dashboards
#
# Performance targets:
# - Query response time: <200ms for 30-day range queries
# - Compression ratio: >50% for data >30 days old
# - Index hit ratio: >99%
# - Cache hit ratio: >95%
#
# Tuning validation:
# 1. Check cache hit ratio: should be >95%
#    SELECT * FROM v_cache_hit_ratio;
#
# 2. Monitor slow queries:
#    SELECT * FROM v_slow_queries;
#
# 3. Check index usage:
#    SELECT * FROM pg_stat_user_indexes;
#
# 4. Monitor table bloat:
#    SELECT * FROM v_table_bloat;
#
# Adjust based on actual workload and monitoring data.
# =============================================================================
