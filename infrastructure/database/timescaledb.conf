-- TimescaleDB-Specific Configuration and Policies
-- FarmFactory Sprint 3 - DO-203: TimescaleDB Performance Tuning
--
-- This file contains TimescaleDB-specific configurations for:
-- - Chunk time intervals (already set during hypertable creation)
-- - Compression policies
-- - Retention policies
-- - Continuous aggregates configuration
--
-- Execute this after hypertables are created

-- =============================================================================
-- CHUNK TIME INTERVAL DOCUMENTATION
-- =============================================================================
--
-- These intervals are set during hypertable creation (in migrations):
--
-- irrigation_events: 7 days per chunk (high volume)
-- nutrient_applications: 7 days per chunk (medium-high volume)
-- water_quality_tests: 30 days per chunk (lower volume)
-- environmental_readings: 1 day per chunk (very high volume - sensor data)
-- phenology_observations: 30 days per chunk (low volume)
-- harvest_records: 30 days per chunk (low volume)
--
-- Chunk sizing rationale:
-- - Smaller chunks (1-7 days): High-frequency data, enables better compression
-- - Larger chunks (30 days): Low-frequency data, reduces chunk overhead
-- =============================================================================

-- =============================================================================
-- COMPRESSION POLICIES
-- =============================================================================
--
-- Enable compression for time-series data older than 30 days
-- Compression can achieve 90%+ storage reduction for time-series data
-- Compressed chunks are read-only but queries still work transparently

-- Environmental Readings (highest volume, compress aggressively)
ALTER TABLE environmental_readings SET (
    timescaledb.compress,
    timescaledb.compress_orderby = 'time DESC',
    timescaledb.compress_segmentby = 'plot_id, metric_type'
);

-- Add compression policy: compress chunks older than 30 days
SELECT add_compression_policy('environmental_readings', INTERVAL '30 days');

-- Irrigation Events
ALTER TABLE irrigation_events SET (
    timescaledb.compress,
    timescaledb.compress_orderby = 'time DESC',
    timescaledb.compress_segmentby = 'plot_id, method'
);

SELECT add_compression_policy('irrigation_events', INTERVAL '30 days');

-- Nutrient Applications
ALTER TABLE nutrient_applications SET (
    timescaledb.compress,
    timescaledb.compress_orderby = 'time DESC',
    timescaledb.compress_segmentby = 'plot_id, nutrient_type'
);

SELECT add_compression_policy('nutrient_applications', INTERVAL '30 days');

-- Water Quality Tests
ALTER TABLE water_quality_tests SET (
    timescaledb.compress,
    timescaledb.compress_orderby = 'time DESC',
    timescaledb.compress_segmentby = 'plot_id, source'
);

SELECT add_compression_policy('water_quality_tests', INTERVAL '60 days');

-- Phenology Observations (lower volume, compress older data)
ALTER TABLE phenology_observations SET (
    timescaledb.compress,
    timescaledb.compress_orderby = 'time DESC',
    timescaledb.compress_segmentby = 'planting_id'
);

SELECT add_compression_policy('phenology_observations', INTERVAL '90 days');

-- Harvest Records
ALTER TABLE harvest_records SET (
    timescaledb.compress,
    timescaledb.compress_orderby = 'harvest_date DESC',
    timescaledb.compress_segmentby = 'planting_id'
);

SELECT add_compression_policy('harvest_records', INTERVAL '180 days');

-- =============================================================================
-- RETENTION POLICIES
-- =============================================================================
--
-- Drop chunks older than retention period to manage storage growth
-- Environmental readings: keep 2 years of detailed data
-- Other data: keep 5 years for historical analysis

-- Environmental Readings: 2 years retention (very high volume)
SELECT add_retention_policy('environmental_readings', INTERVAL '2 years');

-- Irrigation Events: 5 years retention
SELECT add_retention_policy('irrigation_events', INTERVAL '5 years');

-- Nutrient Applications: 5 years retention
SELECT add_retention_policy('nutrient_applications', INTERVAL '5 years');

-- Water Quality Tests: 5 years retention
SELECT add_retention_policy('water_quality_tests', INTERVAL '5 years');

-- Phenology Observations: 7 years retention (valuable historical data)
SELECT add_retention_policy('phenology_observations', INTERVAL '7 years');

-- Harvest Records: Keep indefinitely (no retention policy)
-- This is financial data that should be kept for compliance

-- =============================================================================
-- CONTINUOUS AGGREGATES CONFIGURATION
-- =============================================================================
--
-- Continuous aggregates pre-compute and store aggregated data
-- This dramatically speeds up dashboard queries

-- Hourly Environmental Data Aggregates
CREATE MATERIALIZED VIEW environmental_readings_hourly
WITH (timescaledb.continuous) AS
SELECT
    time_bucket('1 hour', time) AS hour,
    plot_id,
    metric_type,
    AVG(value) AS avg_value,
    MIN(value) AS min_value,
    MAX(value) AS max_value,
    STDDEV(value) AS stddev_value,
    COUNT(*) AS reading_count
FROM environmental_readings
GROUP BY hour, plot_id, metric_type;

-- Refresh policy: keep up to date within 1 hour
SELECT add_continuous_aggregate_policy('environmental_readings_hourly',
    start_offset => INTERVAL '3 hours',
    end_offset => INTERVAL '1 hour',
    schedule_interval => INTERVAL '1 hour');

-- Daily Environmental Data Aggregates
CREATE MATERIALIZED VIEW environmental_readings_daily
WITH (timescaledb.continuous) AS
SELECT
    time_bucket('1 day', time) AS day,
    plot_id,
    metric_type,
    AVG(value) AS avg_value,
    MIN(value) AS min_value,
    MAX(value) AS max_value,
    STDDEV(value) AS stddev_value,
    COUNT(*) AS reading_count
FROM environmental_readings
GROUP BY day, plot_id, metric_type;

SELECT add_continuous_aggregate_policy('environmental_readings_daily',
    start_offset => INTERVAL '7 days',
    end_offset => INTERVAL '1 day',
    schedule_interval => INTERVAL '1 day');

-- Daily Irrigation Totals
CREATE MATERIALIZED VIEW irrigation_daily_totals
WITH (timescaledb.continuous) AS
SELECT
    time_bucket('1 day', time) AS day,
    plot_id,
    method,
    SUM(water_amount_liters) AS total_water_liters,
    AVG(duration_minutes) AS avg_duration,
    COUNT(*) AS irrigation_count
FROM irrigation_events
GROUP BY day, plot_id, method;

SELECT add_continuous_aggregate_policy('irrigation_daily_totals',
    start_offset => INTERVAL '7 days',
    end_offset => INTERVAL '1 day',
    schedule_interval => INTERVAL '1 day');

-- Daily Nutrient Applications
CREATE MATERIALIZED VIEW nutrient_daily_totals
WITH (timescaledb.continuous) AS
SELECT
    time_bucket('1 day', time) AS day,
    plot_id,
    nutrient_type,
    SUM(amount_kg) AS total_amount_kg,
    SUM(n_percent * amount_kg / 100) AS total_n_kg,
    SUM(p_percent * amount_kg / 100) AS total_p_kg,
    SUM(k_percent * amount_kg / 100) AS total_k_kg,
    COUNT(*) AS application_count
FROM nutrient_applications
GROUP BY day, plot_id, nutrient_type;

SELECT add_continuous_aggregate_policy('nutrient_daily_totals',
    start_offset => INTERVAL '7 days',
    end_offset => INTERVAL '1 day',
    schedule_interval => INTERVAL '1 day');

-- =============================================================================
-- COMPRESSION MONITORING
-- =============================================================================
--
-- View to monitor compression status and savings

CREATE VIEW v_compression_stats AS
SELECT
    hypertable_name,
    total_chunks,
    number_compressed_chunks,
    ROUND(100.0 * number_compressed_chunks / NULLIF(total_chunks, 0), 2) AS compression_percentage,
    pg_size_pretty(before_compression_total_bytes) AS uncompressed_size,
    pg_size_pretty(after_compression_total_bytes) AS compressed_size,
    ROUND(100.0 * (1 - after_compression_total_bytes::numeric / NULLIF(before_compression_total_bytes, 0)), 2) AS space_saved_percentage
FROM timescaledb_information.compression_settings cs
LEFT JOIN LATERAL (
    SELECT
        COUNT(*) AS total_chunks,
        SUM(CASE WHEN is_compressed THEN 1 ELSE 0 END) AS number_compressed_chunks,
        SUM(total_bytes) AS before_compression_total_bytes,
        SUM(CASE WHEN is_compressed THEN total_bytes ELSE 0 END) AS after_compression_total_bytes
    FROM timescaledb_information.chunks
    WHERE hypertable_name = cs.hypertable_name
) chunks ON true;

-- =============================================================================
-- RETENTION MONITORING
-- =============================================================================
--
-- View to monitor retention policy status

CREATE VIEW v_retention_stats AS
SELECT
    hypertable_name,
    drop_after AS retention_period,
    pg_size_pretty(
        (SELECT SUM(total_bytes)
         FROM timescaledb_information.chunks c
         WHERE c.hypertable_name = rp.hypertable_name)
    ) AS total_data_size,
    (SELECT COUNT(*)
     FROM timescaledb_information.chunks c
     WHERE c.hypertable_name = rp.hypertable_name) AS total_chunks,
    (SELECT MAX(range_end)
     FROM timescaledb_information.chunks c
     WHERE c.hypertable_name = rp.hypertable_name) AS newest_chunk,
    (SELECT MIN(range_start)
     FROM timescaledb_information.chunks c
     WHERE c.hypertable_name = rp.hypertable_name) AS oldest_chunk
FROM timescaledb_information.jobs j
JOIN timescaledb_information.job_stats js ON j.job_id = js.job_id
CROSS JOIN LATERAL unnest(j.config::json->'hypertable_name') AS hypertable_name
CROSS JOIN LATERAL unnest(j.config::json->'drop_after') AS drop_after
WHERE j.proc_name = 'policy_retention';

