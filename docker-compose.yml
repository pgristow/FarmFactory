version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: farmfactory_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmfactory}
      POSTGRES_USER: ${POSTGRES_USER:-farm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmpass123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farm_user} -d ${POSTGRES_DB:-farmfactory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - farmfactory
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: farmfactory_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - farmfactory
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: farmfactory_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-farm_user}:${POSTGRES_PASSWORD:-farmpass123}@postgres:5432/${POSTGRES_DB:-farmfactory}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-please}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # File Upload
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      UPLOAD_DIR: /app/uploads

      # Email (for alerts)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-noreply@farmfactory.com}

      # Environment
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farmfactory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: farmfactory_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} --queues=imports,default,maintenance
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-farm_user}:${POSTGRES_PASSWORD:-farmpass123}@postgres:5432/${POSTGRES_DB:-farmfactory}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-please}

      # File Upload
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      UPLOAD_DIR: /app/uploads
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}

      # Environment
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farmfactory
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: farmfactory_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-farm_user}:${POSTGRES_PASSWORD:-farmpass123}@postgres:5432/${POSTGRES_DB:-farmfactory}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/0

      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-please}

      # Environment
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farmfactory
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: farmfactory_flower
    command: celery -A app.tasks.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/0

      # Flower settings
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
      FLOWER_PORT: 5555

      # Environment
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - farmfactory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: farmfactory_frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - farmfactory
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local

networks:
  farmfactory:
    driver: bridge
    name: farmfactory_network
